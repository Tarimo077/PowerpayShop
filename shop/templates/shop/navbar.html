{% load static %}

<nav class="w-full bg-white border-b shadow-sm sticky top-0 z-50 py-3">
    <div class="flex items-center justify-between px-4">

        <!-- LOGO (far left) -->
        <a href="/" class="flex items-center flex-shrink-0">
            <img src="{% static 'images/pplogo.png' %}" class="h-12" alt="PowerPay">
        </a>

        <!-- SEARCH BAR (grows to fill space) -->
        <form method="GET" action="{% url 'product_search' %}" 
              class="relative flex-1 px-16">
            <input 
                type="text"
                name="q"
                placeholder="Search products or vendor..."
                value="{{ request.GET.q|default:'' }}"
                class="border-3 border-green-500 rounded-lg w-full px-4 py-2 text-sm focus:ring-2 focus:ring-green-500 outline-none"
                hx-get="{% url 'product_search' %}"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#live-results"
                hx-indicator="#search-spinner">

            <!-- Spinner -->
            <div id="search-spinner" class="absolute right-4 top-2.5 text-gray-400 hidden" hx-indicator>
                <i class="fa fa-spinner fa-spin"></i>
            </div>

            <!-- Live Search Result Dropdown -->
            <div id="live-results" 
                 class="absolute w-full bg-white border-none rounded-lg shadow mt-1 z-50">
            </div>
        </form>

        <!-- RIGHT ICONS (far right) -->
        <div class="flex items-center gap-6 flex-shrink-0">

            {% if user.is_authenticated %}

                <!-- Wishlist -->
                <a href="{% url 'wishlist_page' %}" 
                   class="flex flex-col items-center text-green-600 hover:text-orange-500">
                    <span class="relative text-2xl indicator">
                        <i class="fa-solid fa-heart"></i>
                        {% if wishlist_count > 0 %}
                        <span class="badge indicator-item bg-orange-500 text-white text-sm rounded-full">
                            {{ wishlist_count }}
                        </span>
                        {% endif %}
                    </span>
                    <span class="text-xs font-medium">Favourites</span>
                </a>

                <!-- Cart -->
                <a href="{% url 'view_cart' %}" 
                   class="flex flex-col items-center text-green-600 hover:text-orange-500">
                    <span class="relative text-2xl indicator">
                        <i class="fa-solid fa-cart-shopping"></i>
                        {% if cart_item_count > 0 %}
                        <span class="badge indicator-item bg-orange-500 text-white text-sm rounded-full py-2">
                            {{ cart_item_count }}
                        </span>
                        {% endif %}
                    </span>
                    <span class="text-xs font-medium">Cart</span>
                </a>

                <!-- Notifications -->
                <button 
                    id="notifDropdownBtn"
                    class="flex flex-col items-center text-green-600 hover:text-orange-500"
                    hx-get="{% url 'notifications:dropdown' %}"
                    hx-trigger="click"
                    hx-target="#notifDropdown"
                    hx-swap="innerHTML">
                    
                    <span class="relative text-2xl indicator">
                        <i class="fa-solid fa-bell"></i>
                        {% if unread_notif_count > 0 %}
                        <span class="badge indicator-item bg-orange-500 text-white text-sm rounded-full py-2">
                            {{ unread_notif_count }}
                        </span>
                        {% endif %}
                    </span>
                    <span class="text-xs font-medium">Notifications</span>
                </button>

                <!-- Avatar (far right) -->
                {% include 'shop/avatar.html' %}

            {% else %}
                <a href="{% url 'login' %}" class="text-green-600 font-semibold hover:text-orange-500">
                    Login
                </a>
                <a href="{% url 'register' %}" class="text-green-600 font-semibold hover:text-orange-500">
                    Sign Up
                </a>
            {% endif %}
        </div>

        <!-- Notification dropdown target -->
        <div id="notifDropdown" class="absolute right-4 top-16 w-80 bg-white border rounded-lg shadow-lg z-50 hidden"></div>

    </div>
</nav>
