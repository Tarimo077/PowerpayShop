{% load static %}
<nav class="shop-navbar">
  <div class="shop-shell shop-nav-inner">
    <a href="{% url 'index' %}" class="shop-logo flex items-center gap-3" aria-label="PowerPay Shop home">
      <img src="{% static 'images/pplogo.png' %}" alt="PowerPay">
    </a>

    <form method="GET" action="{% url 'product_search' %}" class="shop-search">
      <input
        type="text"
        name="q"
        placeholder="Search products, vendors, stoves..."
        value="{{ request.GET.q|default:'' }}"
        autocomplete="off"
        hx-get="{% url 'product_search' %}"
        hx-trigger="keyup changed delay:280ms"
        hx-target="#live-results"
        hx-indicator="#search-spinner">
      <span id="search-spinner" class="shop-search-icon hidden" hx-indicator><i class="fa fa-spinner fa-spin"></i></span>
      <span class="shop-search-icon" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
      <div id="live-results" class="shop-live-results hidden"></div>
    </form>

    <div class="shop-nav-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'wishlist_page' %}" class="shop-nav-link" title="Favourites">
          <span class="relative"><i class="fa-solid fa-heart"></i>{% if wishlist_count > 0 %}<span class="shop-badge absolute -top-3 -right-3">{{ wishlist_count }}</span>{% endif %}</span>
          <span>Favourites</span>
        </a>
        <a href="{% url 'view_cart' %}" class="shop-nav-link" title="Cart">
          <span class="relative"><i class="fa-solid fa-cart-shopping"></i>{% if cart_item_count > 0 %}<span class="shop-badge absolute -top-3 -right-3">{{ cart_item_count }}</span>{% endif %}</span>
          <span>Cart</span>
        </a>
        <button id="notifDropdownBtn" type="button" class="shop-nav-link bg-transparent border-0 cursor-pointer" title="Notifications"
                hx-get="{% url 'notifications:dropdown' %}"
                hx-trigger="click"
                hx-target="#notifDropdown"
                hx-swap="innerHTML">
          <span class="relative"><i class="fa-solid fa-bell"></i>{% if unread_notif_count > 0 %}<span class="shop-badge absolute -top-3 -right-3">{{ unread_notif_count }}</span>{% endif %}</span>
          <span>Alerts</span>
        </button>
        {% include 'shop/avatar.html' %}
      {% else %}
        <a href="{% url 'login' %}" class="shop-btn shop-btn-soft">Login</a>
        <a href="{% url 'register' %}" class="shop-btn shop-btn-primary hidden sm:inline-flex">Join</a>
      {% endif %}
    </div>

    <div id="notifDropdown" class="absolute right-4 top-20 w-80 max-w-[calc(100vw-2rem)] bg-white border border-slate-200 rounded-3xl shadow-2xl z-50 hidden overflow-hidden"></div>
  </div>
</nav>
