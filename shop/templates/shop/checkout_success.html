{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-r from-green-100 to-orange-100">

  <div class="card bg-white p-8 rounded-2xl shadow-2xl text-center max-w-xl">
    <img src="{% static 'images/pplogo.png' %}" class="w-24 mx-auto mb-4" alt="logo">
    <h2 class="text-2xl font-bold text-green-700 mb-3">Payment initiated</h2>
    <p class="text-gray-700">We have sent an STK push to your phone. Please enter your MPESA PIN to complete the payment.</p>

    {% if ref %}
    <p class="mt-4 text-sm text-gray-500">Reference: <span class="font-mono">{{ ref }}</span></p>
    {% endif %}

    <div class="mt-6">
      <a href="{% url 'index' %}" class="btn bg-green-600 text-white rounded-lg px-6 py-2">Continue shopping</a>
    </div>
  </div>

</div>
{% endblock %}
