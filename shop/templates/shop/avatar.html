<!-- Avatar Dropdown Container -->
<div id="navbarAvatarDropdown" class="relative">

    <!-- Avatar Button (Trigger) -->
    <button id="navbarAvatarBtn" type="button" class="avatar avatar-online cursor-pointer">
        <div class="bg-green-600 text-white w-12 h-12 flex items-center justify-center rounded-full">
            <span class="text-xl font-bold">
                {{ request.user.username|first|upper }}
            </span>
        </div>
    </button>

    <!-- Dropdown Menu (Hidden by default) -->
    <ul id="navbarAvatarMenu"
        class="menu menu-sm absolute right-0 mt-2 p-2 w-52 rounded-lg
               shadow-2xl bg-white hidden z-50">

        <li class="mt-2 hover:bg-gray-200 rounded-md p-1">
            <a href="{% url 'profile' %}">
                <i class="fa-solid fa-user mr-2"></i> Profile
            </a>
        </li>

        <li class="mt-2 hover:bg-gray-200 rounded-md p-1">
            <a href="{% url 'vendor_dashboard' %}">
                <i class="fa-solid fa-store mr-2"></i> Vendor Dashboard
            </a>
        </li>

        <li class="mt-2 hover:bg-gray-200 rounded-md p-1">
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="text-red-600">
                    <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
                </button>
            </form>
        </li>

    </ul>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("navbarAvatarBtn");
    const menu = document.getElementById("navbarAvatarMenu");

    btn.addEventListener("click", (e) => {
        e.stopPropagation();
        menu.classList.toggle("hidden");
    });

    // Close dropdown if clicking outside
    document.addEventListener("click", (e) => {
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
            menu.classList.add("hidden");
        }
    });
});
</script>
