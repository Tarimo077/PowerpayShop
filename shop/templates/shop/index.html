{% extends "base.html" %}
{% load static %}
{% load humanize %}

{% block content %}


<div class="grid min-h-screen"
     style="grid-template-rows: auto 1fr auto;">  <!-- fallback if arbitrary grid rows are not enabled -->

  <!-- Header -->
  {% include 'shop/navbar.html' %}

<!-- CUSTOMER VIEW ONLY -->
<div class="container mx-auto mt-6">

    <!-- FILTERS (outside HX swap) -->
    <form id="filterForm"
        method="GET"
        hx-get="{% url 'index' %}"
        hx-target="#productsWrapper"
        hx-swap="innerHTML"
        hx-trigger="submit,
                    keyup delay:300ms from:#searchInput,
                    change from:#vendorSelect,
                    input delay:300ms from:#minPrice,
                    input delay:300ms from:#maxPrice"
        class="mb-4 flex flex-wrap items-center gap-3">

        <input type="hidden" name="per_page" value="{{ per_page }}">


        <!-- SEARCH -->
        <input type="text" id="searchInput" name="search" placeholder="Search products..."
            value="{{ request.GET.search|default:'' }}"
            class="input input-bordered w-40 md:w-64 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">

        <!-- VENDOR -->
        <select name="vendor" id="vendorSelect"
                class="select select-bordered w-40 md:w-64 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
            <option value="">All Vendors</option>
            {% for v in vendors %}
                <option value="{{ v.id }}" {% if request.GET.vendor == v.id|stringformat:"s" %}selected{% endif %}>
                    {{ v.shop_name|default:v.user }}
                </option>
            {% endfor %}
        </select>

        <!-- MIN PRICE -->
        <input type="number" id="minPrice" name="min_price" placeholder="Min Price"
            value="{{ request.GET.min_price|default:'' }}"
            class="input input-bordered w-28 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">

        <!-- MAX PRICE -->
        <input type="number" id="maxPrice" name="max_price" placeholder="Max Price"
            value="{{ request.GET.max_price|default:'' }}"
            class="input input-bordered w-28 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">

        <!-- CLEAR FILTERS BUTTON -->
        <button type="button"
                class="btn bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 transition"
                onclick="
                    document.getElementById('searchInput').value = '';
                    document.getElementById('vendorSelect').selectedIndex = 0;
                    document.getElementById('minPrice').value = '';
                    document.getElementById('maxPrice').value = '';

                    // Reset per_page if present
                    const pp = document.querySelector('input[name=per_page]');
                    if (pp) pp.value = '{{ per_page }}';

                    // Remove page field if HTMX added it
                    const pg = document.querySelector('input[name=page]');
                    if (pg) pg.remove();

                    htmx.trigger('#filterForm', 'submit');
                ">
            <i class="fa-solid fa-filter-circle-xmark mr-1"></i> Clear
        </button>


    </form>

    <div id="productsWrapper" class="mb-12">
        {% include "shop/product_grid.html" %}
        
    </div>

    
</div>
{% include 'footer.html' %}
</div>
{% endblock %}
