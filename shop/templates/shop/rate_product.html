{% extends "base.html" %}
{% block content %}

<div class="container mx-auto max-w-xl p-6">
    <h2 class="text-2xl font-bold mb-3">Rate {{ product.name }}</h2>

    <form method="POST">
        {% csrf_token %}
        <label class="block">
            <span class="font-medium">Your Rating (1-5)</span>
            {{ form.rating }}
        </label>

        <button class="mt-4 bg-green-600 px-6 py-2 text-white rounded-lg">
            Submit Rating
        </button>
    </form>
</div>

{% endblock %}
