{% extends "base.html" %}
{% load humanize %}
{% block content %}
{% include "shop/navbar.html" %}

<div class="container mx-auto p-6 max-w-5xl">
    <h2 class="text-2xl font-bold mb-4">My Wishlist</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        {% for w in items %}
        <div class="card bg-white rounded-xl shadow p-3">
            <img src="{{ w.product.image.url }}" class="rounded-lg w-full max-h-48 object-contain" />

            <h3 class="text-lg font-semibold mt-3">{{ w.product.name }}</h3>
            <p class="text-green-600 font-bold">Ksh. {{ w.product.price|intcomma }}</p>

            <a href="{% url 'product_detail' w.product.id %}" 
               class="btn bg-green-600 text-white w-full mt-3">View Details</a>
        </div>
        {% empty %}
        <p class="text-gray-500">Your wishlist is empty.</p>
        {% endfor %}
    </div>
</div>

{% endblock %}
