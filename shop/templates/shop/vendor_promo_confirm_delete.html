{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 shadow rounded-xl">
    <h2 class="text-xl font-bold text-gray-700 mb-4">Delete Promo Code</h2>
    <p class="mb-4">Are you sure you want to delete the promo code <strong>{{ promo.code }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg">Yes, Delete</button>
        <a href="{% url 'vendor_dashboard' %}" class="bg-gray-300 px-4 py-2 rounded-lg ml-2">Cancel</a>
    </form>
</div>
{% endblock %}
