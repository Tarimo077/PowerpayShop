{% load humanize %}
{% if products %}
    <ul class="space-y-2">
        {% for product in products %}
        <li class="p-4 hover:bg-green-100 cursor-pointer flex items-center">
            {% if product.image %}
            <img src="{{ product.image.url }}" class="w-10 h-10 object-cover rounded-md mr-4">
            {% endif %}

            <a href="{% url 'product_detail' product.pk %}" class="flex-1">
                <p class="font-semibold text-sm">{{ product.name }}</p>
                <p class="text-xs text-gray-500">{{ product.vendor.shop_name }}</p>
            </a>

            <span class="text-green-600 font-bold text-sm">
                Ksh {{ product.price|intcomma }}
            </span>
        </li>
        
        {% endfor %}
    </ul>
{% else %}
    {% if query %}
        <p class="p-3 text-gray-500 text-sm">No products found.</p>
    {% endif %}
{% endif %}
