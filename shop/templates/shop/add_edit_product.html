{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gradient-to-r from-green-100 via-orange-100 to-green-50">
  <div class="card w-96 bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8">
    <div class="flex justify-center mb-2">
      <img src="{% static 'images/pplogo.png' %}" alt="PowerPayShop Logo" class="w-2/3 h-2/3 object-contain">
    </div>
    <h2 class="text-2xl font-bold text-green-700 dark:text-green-400 text-center mb-4">{{ title }}</h2>

    <form method="POST" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-control w-full">
          {{ field.label_tag }}
          {{ field }}
          {% if field.help_text %}
            <span class="text-sm text-gray-500 dark:text-gray-300">{{ field.help_text }}</span>
          {% endif %}
          {% for error in field.errors %}
            <span class="text-sm text-red-600 dark:text-red-400">{{ error }}</span>
          {% endfor %}
        </div>
      {% endfor %}

      <div class="flex justify-center mt-4">
        <button type="submit" class="btn bg-gradient-to-r from-green-500 to-orange-400 text-white font-bold w-1/2 shadow-lg hover:from-green-600 hover:to-orange-500 transition rounded-lg">
          <i class="fa-solid fa-floppy-disk m-1"></i>Save
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
