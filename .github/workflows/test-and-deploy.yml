name: Test and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: powerpay_ci
          POSTGRES_USER: powerpay_ci
          POSTGRES_PASSWORD: powerpay_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U powerpay_ci -d powerpay_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME_POWERPAY: powerpay_ci
      DB_USER_POWERPAY: powerpay_ci
      DB_PASSWORD_POWERPAY: powerpay_ci_password
      DB_HOST_POWERPAY: 127.0.0.1
      DB_PORT_POWERPAY: "5432"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: theme/static_src/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: theme/static_src
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: theme/static_src
        run: npm run build

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to test database
        run: python manage.py migrate --noinput

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Verify static file collection
        run: python manage.py collectstatic --noinput --clear

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 25m
          envs: DEPLOY_SHA
          script: |
            set -e
            cd /shop/PowerpayShop

            # Preserve tracked server-side edits so they cannot block deployment.
            # They remain recoverable with `git stash list` after deployment.
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              git stash push -m "Automatic pre-deploy stash $DEPLOY_SHA"
            fi

            # Preserve and remove locally generated migration files that are
            # not part of the tested commit. Stale merge migrations can make
            # Django's migration graph impossible to load.
            if [ -n "$(git ls-files --others --exclude-standard -- shop/migrations)" ]; then
              git stash push --include-untracked \
                -m "Automatic untracked migration stash $DEPLOY_SHA" \
                -- shop/migrations
            fi

            # Older server checkouts may have this generated file untracked,
            # while the repository now tracks it.
            if [ -e package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
              rm -f package-lock.json
            fi

            git fetch origin main
            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            . powerpayshopvenv/bin/activate
            python -m pip install -r requirements.txt
            cd theme/static_src
            npm ci
            npm run build
            cd ../..
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            python manage.py check
            sudo nginx -t
            sudo systemctl restart powerpayshop
            sudo systemctl reload nginx
