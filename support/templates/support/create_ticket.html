{% extends "base.html" %}
{% block content %}
<div class="grid min-h-screen"
     style="grid-template-rows: auto 1fr auto;">

{% include 'shop/navbar.html' %}

<div class="max-w-2xl mx-auto p-4 mt-4">
    <h2 class="text-2xl text-green-600 font-bold mb-6"><i class="fa-solid fa-ticket mr-2"></i>Create Support Ticket</h2>
    <form method="POST" class="flex flex-col gap-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded mt-4"><i class="fa-solid fa-ticket mr-2"></i>Submit Ticket</button>
    </form>
</div>

{% include 'footer.html' %}
{% endblock %}
