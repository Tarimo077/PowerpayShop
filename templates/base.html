<!DOCTYPE html>
{% load static %}
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f8f4f">
  <title>{% block title %}PowerPayShop{% endblock %}</title>
  <link rel="icon" href="{% static 'images/pp_no_bgcropped.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/69d2af506e.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> 
    *, *::before, *::after { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body {
      font-family: "Inter";
      min-width: 0;
      overflow-x: hidden;
    }
    img, video, svg { max-width: 100%; height: auto; }
    input, select, textarea, button { max-width: 100%; }
    td, th, p, a { overflow-wrap: anywhere; }
    .responsive-scroll { overflow-x: auto; overscroll-behavior-inline: contain; -webkit-overflow-scrolling: touch; }
    @media (max-width: 640px) {
      .mobile-full { width: 100%; }
      dialog { max-width: 100vw; }
    }
  </style>
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
  {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-emerald-50 to-orange-50 bg-fixed text-slate-900 font-inter grid grid-rows-[auto_1fr_auto]">
  <main class="w-full">
    {% block content %}{% endblock %}
  </main>

  <dialog
    id="messageModal"
    class="fixed inset-0 z-[9999] m-0 h-full w-full max-w-none bg-transparent p-0 backdrop:bg-slate-950/50 backdrop:backdrop-blur-md"
  >
    <div class="flex min-h-full items-start justify-center px-4 pt-6 sm:justify-end sm:px-6 lg:px-8">
      <div
        id="modalBox"
        class="relative w-full max-w-md overflow-hidden rounded-[2rem] border border-white/60 bg-white/90 shadow-[0_24px_80px_rgba(15,23,42,0.22)] backdrop-blur-2xl transition-all duration-300 ease-out opacity-0 translate-y-[-18px] scale-95"
      >
        <div id="modalAccent" class="absolute inset-x-0 top-0 h-1.5 bg-emerald-500"></div>

        <button
          onclick="closeModal()"
          class="absolute right-4 top-4 z-10 inline-flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-500 shadow-sm transition hover:bg-slate-200 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          aria-label="Close message"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>

        <div class="p-6 pr-14">
          <div class="flex items-start gap-4">
            <div
              id="modalIconWrapper"
              class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-emerald-100 text-emerald-700 shadow-inner"
            >
              <i id="modalIcon" class="fa-solid fa-circle-info text-2xl"></i>
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <p id="modalLabel" class="text-xs font-black uppercase tracking-[0.22em] text-emerald-600">
                  Notification
                </p>
              </div>

              <h3 id="modalTitle" class="mt-1 text-2xl font-black leading-tight text-slate-950">
                Message
              </h3>

              <p id="modalMessage" class="mt-2 text-sm font-medium leading-6 text-slate-600">
                Message content
              </p>
            </div>
          </div>
        </div>

        <div class="px-6 pb-5">
          <div class="h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
            <div id="modalProgress" class="h-full w-full rounded-full bg-emerald-500"></div>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    let modalTimer = null;
    let progressTimer = null;

    function closeModal() {
      const modal = document.getElementById("messageModal");
      const modalBox = document.getElementById("modalBox");

      if (!modal || !modalBox || !modal.open) return;

      clearTimeout(modalTimer);
      clearTimeout(progressTimer);

      modalBox.classList.add("opacity-0", "translate-y-[-18px]", "scale-95");
      modalBox.classList.remove("opacity-100", "translate-y-0", "scale-100");

      setTimeout(() => {
        if (modal.open) modal.close();
      }, 260);
    }

    function showModernMessage(type, title, message) {
      const modal = document.getElementById("messageModal");
      const modalBox = document.getElementById("modalBox");
      const modalTitle = document.getElementById("modalTitle");
      const modalMessage = document.getElementById("modalMessage");
      const modalLabel = document.getElementById("modalLabel");
      const modalAccent = document.getElementById("modalAccent");
      const iconWrapper = document.getElementById("modalIconWrapper");
      const icon = document.getElementById("modalIcon");
      const progress = document.getElementById("modalProgress");

      if (!modal || !modalBox) return;

      clearTimeout(modalTimer);
      clearTimeout(progressTimer);

      const styles = {
        success: {
          label: "Success",
          accent: "bg-emerald-500",
          labelText: "text-emerald-600",
          iconBox: "bg-emerald-100 text-emerald-700",
          progress: "bg-emerald-500",
          icon: "fa-solid fa-circle-check text-2xl"
        },
        error: {
          label: "Error",
          accent: "bg-red-500",
          labelText: "text-red-600",
          iconBox: "bg-red-100 text-red-700",
          progress: "bg-red-500",
          icon: "fa-solid fa-circle-exclamation text-2xl"
        },
        warning: {
          label: "Warning",
          accent: "bg-amber-500",
          labelText: "text-amber-600",
          iconBox: "bg-amber-100 text-amber-700",
          progress: "bg-amber-500",
          icon: "fa-solid fa-triangle-exclamation text-2xl"
        },
        info: {
          label: "Info",
          accent: "bg-blue-500",
          labelText: "text-blue-600",
          iconBox: "bg-blue-100 text-blue-700",
          progress: "bg-blue-500",
          icon: "fa-solid fa-circle-info text-2xl"
        }
      };

      const selected = styles[type] || styles.info;

      modalTitle.textContent = title || selected.label;
      modalMessage.textContent = message || "";
      modalLabel.textContent = selected.label;

      modalAccent.className = `absolute inset-x-0 top-0 h-1.5 ${selected.accent}`;
      modalLabel.className = `text-xs font-black uppercase tracking-[0.22em] ${selected.labelText}`;
      iconWrapper.className = `flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl shadow-inner ${selected.iconBox}`;
      icon.className = selected.icon;
      progress.className = `h-full w-full rounded-full ${selected.progress}`;

      progress.style.transition = "none";
      progress.style.width = "100%";

      if (!modal.open) modal.showModal();

      requestAnimationFrame(() => {
        modalBox.classList.remove("opacity-0", "translate-y-[-18px]", "scale-95");
        modalBox.classList.add("opacity-100", "translate-y-0", "scale-100");

        progressTimer = setTimeout(() => {
          progress.style.transition = "width 3400ms linear";
          progress.style.width = "0%";
        }, 80);
      });

      modalTimer = setTimeout(closeModal, 3500);
    }

    document.body.addEventListener("htmx:configRequest", (event) => {
      const csrfInput = document.querySelector("[name=csrfmiddlewaretoken]");
      const csrfToken = csrfInput ? csrfInput.value : getCookie("csrftoken");
      if (csrfToken) event.detail.headers["X-CSRFToken"] = csrfToken;
    });

    document.addEventListener('click', function(event){
      const dropdown = document.getElementById('notifDropdown');
      const btn = document.getElementById('notifDropdownBtn');
      if (!btn || !dropdown) return;
      if (btn.contains(event.target)) {
        dropdown.classList.toggle('hidden');
      } else if (!dropdown.contains(event.target)) {
        dropdown.classList.add('hidden');
      }
    });

    document.body.addEventListener('htmx:afterSwap', (event) => {
      if (event.target && event.target.id === "live-results") {
        event.target.classList.remove("hidden");
      }
    });

    document.getElementById("messageModal").addEventListener("click", function(event) {
      if (event.target === this) {
        closeModal();
      }
    });

    {% if messages %}
      {% for message in messages %}
        showModernMessage(
          "{{ message.level_tag|default:'info'|escapejs }}",
          "{{ message.tags|capfirst|default:'Message'|escapejs }}",
          "{{ message|escapejs }}"
        );
      {% endfor %}
    {% endif %}
  </script>

  <script src="{% static 'js/shop-interactions.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
