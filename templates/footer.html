{% load static %}
<footer class="shop-footer">
  <div class="shop-shell py-10 grid gap-8 md:grid-cols-[1.4fr_.8fr_.8fr] items-start">
    <div class="space-y-4">
      <a href="{% url 'index' %}" class="inline-flex items-center gap-3">
        <img src="{% static 'images/pplogo.png' %}" alt="PowerPay Logo" class="h-12 object-contain">
      </a>
      <p class="max-w-md text-sm shop-muted leading-relaxed">
        Appliances For The Next Billion.
      </p>
      <div class="flex gap-3">
        <a href="#" class="shop-icon-btn" aria-label="X / Twitter"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" class="shop-icon-btn" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" class="shop-icon-btn" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      </div>
    </div>

    <div class="flex gap-6 justify-between p-6">
      <div>
        <h6 class="font-black text-gray-900 mb-3">Company</h6>
        <nav class="grid gap-2 text-sm shop-muted">
          <a href="#" class="hover:text-green-700 transition">About PowerPay</a>
          <a href="#" class="hover:text-green-700 transition">Contact</a>
          <a href="{% url 'support_ticket_list' %}" class="hover:text-green-700 transition">Support</a>
        </nav>
      </div>

      <div>
        <h6 class="font-black text-gray-900 mb-3">Marketplace</h6>
        <nav class="grid gap-2 text-sm shop-muted">
          <a href="{% url 'index' %}" class="hover:text-green-700 transition">Browse products</a>
          <a href="{% url 'wishlist_page' %}" class="hover:text-green-700 transition">Favourites</a>
          <a href="{% url 'view_cart' %}" class="hover:text-green-700 transition">Cart</a>
        </nav>
      </div>
    </div>
  </div>
  <div class="border-t border-slate-200/70 py-4 text-center text-sm shop-muted">
    &copy; {% now "Y" %} PowerPay Africa Ltd. All rights reserved.
  </div>
</footer>
