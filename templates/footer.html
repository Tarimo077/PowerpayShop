{% load static %}
<footer class="bg-white text-gray-700 border-t border-gray-200">
  <div class="container mx-auto px-2 py-10 flex flex-col md:flex-row md:justify-between md:items-start gap-8">

    <!-- Branding -->
    <div class="flex flex-col items-start gap-4 md:gap-6">
      <div class="flex items-center gap-3">
        <img src="{% static 'images/pplogo.png' %}" alt="PowerPay Logo" class="h-12">
      </div>

      <!-- Social Icons -->
      <div class="flex gap-3 mt-2">
        <a href="#" class="w-16 h-16 flex items-center justify-center rounded-full bg-gray-100 text-black hover:bg-blue-50 hover:scale-110 transition-transform">
          <i class="fa-brands fa-square-x-twitter text-2xl"></i>
        </a>
        <a href="#" class="w-16 h-16 flex items-center justify-center rounded-full bg-gray-100 text-red-500 hover:bg-red-50 hover:scale-110 transition-transform">
          <i class="fa-brands fa-youtube text-2xl"></i>
        </a>
        <a href="#" class="w-16 h-16 flex items-center justify-center rounded-full bg-gray-100 text-blue-700 hover:bg-blue-50 hover:scale-110 transition-transform">
          <i class="fa-brands fa-square-facebook text-2xl"></i>
        </a>
      </div>
    </div>

    <!-- Company + Legal Links -->
    <div class="flex flex-col md:flex-row gap-8 md:gap-16 md:items-start md:justify-end">
      <!-- Company -->
      <div>
        <h6 class="font-bold text-gray-800 mb-2">Company</h6>
        <nav class="flex flex-col gap-4">
          <a href="#" class="link link-hover hover:text-green-600 transition">About Us</a>
          <a href="#" class="link link-hover hover:text-green-600 transition">Contact</a>
        </nav>
      </div>

      <!-- Legal -->
      <div>
        <h6 class="font-bold text-gray-800 mb-2">Legal</h6>
        <nav class="flex flex-col gap-4">
          <a href="#" class="link link-hover hover:text-green-600 transition">Terms of Use</a>
          <a href="#" class="link link-hover hover:text-green-600 transition">Privacy Policy</a>
        </nav>
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="border-t border-gray-200 text-gray-500 text-sm py-4 text-center">
    &copy; 2025 Powerpay Africa Ltd. All rights reserved.
  </div>
</footer>
